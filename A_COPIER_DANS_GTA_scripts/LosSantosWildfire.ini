; =====================================================================
;  LosSantosWildfire - configuration
;  A placer dans : <GTA V>\scripts\LosSantosWildfire.ini
;  Les valeurs hors limites sont automatiquement ramenees dans les bornes.
; =====================================================================

[General]
; Active le mod des le chargement du jeu (true/false)
EnabledOnStart = false
; Intensite au demarrage : Faible / Moyenne / Extreme
DefaultIntensity = Moyenne
; Touches (noms System.Windows.Forms.Keys : F10, F11, NumPad5, Insert...)
ToggleKey = F10
IntensityKey = F11

[Fires]
; Rayon (m) autour du joueur dans lequel les vrais feux existent (30 - 400)
Radius = 150
; Nombre max de feux actifs a intensite Moyenne (1 - 60).
; Faible = x0.5, Extreme = x1.4 (plafonne a 60, bien sous la limite moteur ~128)
MaxFires = 40
; Feux "enfants" que le moteur peut generer pour chaque feu de script (0 - 5)
MaxChildFires = 1
; Intervalle de mise a jour des feux en ms (minimum 500)
UpdateIntervalMs = 500
; Nombre max de feux allumes par mise a jour (lisse les pics de charge)
MaxActivationsPerUpdate = 4
; Genere des foyers aleatoires autour du joueur, en plus des zones predefinies
RandomFires = true

[Spread]
; Propagation : un feu peut en creer un nouveau a 6-15 m
Enabled = true
; Toutes les X secondes (5 - 600)
IntervalSeconds = 20

[Smoke]
; Colonnes de fumee lointaines a intensite Extreme (0 - 8). Faible = x0.5, Moyenne = x0.75
Columns = 6
; Distance max (m) a laquelle on place des colonnes
MaxDistance = 3000

[Atmosphere]
; Filtre de couleur + meteo + cendres
Enabled = true
; Modificateur timecycle (voir README pour d'autres choix). Vide = aucun filtre.
TimecycleModifier = glasses_orange
; Cendres autour du joueur
Ash = true

[Emergency]
; Envoie des pompiers (incident de dispatch) vers les feux proches
Firefighters = true
; Les pietons proches des flammes s'enfuient
PedsFlee = true

[Effects]
; Noms d'assets ptfx (dictionnaire + effet). Modifiables sans recompiler.
; Flammes : effet "core" connu (avion en feu). Alternative : ent_ray_heli_aprtmnt_l_fire (plus gros)
FlameAsset = core
FlameEffect = fire_wrecked_plane_cockpit
; Fumee locale (un feu sur trois)
FireSmokeAsset = core
FireSmokeEffect = ent_amb_smoke_foundry
; Colonne de fumee lointaine (panache de la mission Trevor 3)
; Alternative : scr_agencyheistb / scr_env_agency3b_smoke
ColumnAsset = scr_trevor3
ColumnEffect = scr_trev3_trailer_plume
; Cendres : NOM INCERTAIN. Si aucune cendre n'apparait, essayez un autre effet
; (ex. core / ent_amb_smoke_general) ou mettez Ash = false.
AshAsset = core
AshEffect = ent_amb_falling_ash
